<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Respond to Your Proposal — Essential Cures</title>
<style>
  body {
    font-family: Calibri, Candara, Segoe, "Segoe UI", Optima, Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 24px 12px;
    color: #2c3e50;
  }
  .card {
    max-width: 560px;
    margin: 0 auto;
    background: #fff;
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .header {
    display: flex;
    align-items: center;
    padding: 16px 20px;
    border-bottom: 2px solid #005090;
  }
  .header img { width: 56px; display: block; }
  .header .divider { width: 2px; background: #005090; align-self: stretch; margin: 0 16px; }
  .header .brand-name { margin: 0; font-size: 16px; font-weight: bold; color: #005090; letter-spacing: 1px; }
  .header .brand-tag { margin: 4px 0 0; font-size: 11px; color: #4a8b2c; font-weight: bold; font-style: italic; }
  .body-pad { padding: 20px; }
  .status-msg { text-align: center; padding: 40px 20px; font-size: 14px; color: #6b7c8c; }
  .status-msg.error { color: #b03030; }
  h2 { font-size: 15px; color: #003060; margin: 0 0 8px; }
  p.deal-name { font-size: 13px; color: #6b7c8c; margin: 0 0 20px; }
  .options {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }
  .option-choice {
    flex: 1;
    border: 2px solid #dce1e6;
    border-radius: 4px;
    padding: 14px;
    cursor: pointer;
    text-align: center;
    transition: border-color 0.15s;
  }
  .option-choice.selected { border-color: #4a8b2c; background: #e8f5e9; }
  .option-choice .label { font-size: 12px; font-weight: bold; color: #6b7c8c; letter-spacing: 0.5px; }
  .option-choice .amount { font-size: 18px; font-weight: bold; color: #005090; margin-top: 4px; }
  .extra-choices { display: flex; gap: 10px; margin-bottom: 20px; }
  .extra-choices button {
    flex: 1;
    background: #f7f9fb;
    border: 1px solid #dce1e6;
    border-radius: 4px;
    padding: 10px;
    font-size: 13px;
    color: #2c3e50;
    cursor: pointer;
  }
  .extra-choices button.selected { border-color: #005090; background: #e8f0f8; font-weight: bold; }
  label.remarks-label { display: block; font-size: 12px; color: #6b7c8c; margin-bottom: 6px; }
  textarea {
    width: 100%;
    box-sizing: border-box;
    border: 1px solid #dce1e6;
    border-radius: 4px;
    padding: 10px;
    font-family: inherit;
    font-size: 13px;
    resize: vertical;
    min-height: 70px;
    margin-bottom: 20px;
  }
  .submit-btn {
    width: 100%;
    background: #4a8b2c;
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 14px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
  }
  .submit-btn:disabled { background: #a9c79a; cursor: not-allowed; }
  .footer {
    display: flex;
  }
  .footer div { flex: 1; text-align: center; padding: 10px 0; font-size: 11px; font-style: italic; font-weight: bold; color: #fff; }
  .footer .green { background: #4a8b2c; }
  .footer .blue { background: #005090; }
  .already-note { background: #fff8e1; border-left: 4px solid #d4a017; padding: 12px 14px; font-size: 13px; margin-bottom: 16px; }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <img src="https://essentialcures.com/assets/images/essential-cures-logo.png" alt="Essential Cures Inc.">
    <div class="divider"></div>
    <div>
      <p class="brand-name">ESSENTIAL CURES INC.</p>
      <p class="brand-tag">Compliant Solutions. Confident Care.</p>
    </div>
  </div>
  <div id="content" class="body-pad">
    <div class="status-msg">Loading your proposal…</div>
  </div>
  <div class="footer">
    <div class="green">Compliant Solutions. Confident Care.</div>
    <div class="blue">Quality Built In. Not Bolted On.</div>
  </div>
</div>

<script>
// CONFIGURE THIS: your deployed Worker's base URL
const WORKER_BASE = 'https://cm27-gate-proxy.faisal-khan-e13.workers.dev';

const params = new URLSearchParams(window.location.search);
const token = params.get('token');
const contentEl = document.getElementById('content');
let selectedDecision = null;

function showError(msg) {
  contentEl.innerHTML = `<div class="status-msg error">${msg}</div>`;
}

async function loadProposal() {
  if (!token) {
    showError('This link is missing a required parameter. Please use the link from your proposal email.');
    return;
  }
  try {
    const resp = await fetch(`${WORKER_BASE}/api/proposal/gate`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ responseToken: token }),
    });
    const data = await resp.json();
    if (data.status !== 'success') {
      showError(data.reason || 'This proposal link is invalid or has expired.');
      return;
    }
    renderForm(data);
  } catch (err) {
    showError('Something went wrong loading your proposal. Please try again or contact us directly.');
  }
}

function renderForm(data) {
  const alreadyBlock = data.alreadyResponded
    ? `<div class="already-note">You already responded to this proposal on ${data.existingDecisionDate} with: <strong>${data.existingDecision}</strong>. Submitting again below will update your response.</div>`
    : '';

  contentEl.innerHTML = `
    <h2>Your Proposal</h2>
    <p class="deal-name">${data.dealName || ''}</p>
    ${alreadyBlock}
    <div class="options">
      <div class="option-choice" data-value="Option A">
        <div class="label">OPTION A</div>
        <div class="amount">$${data.optionATotal} CAD</div>
      </div>
      <div class="option-choice" data-value="Option B - Specialist">
        <div class="label">OPTION B - SPECIALIST</div>
        <div class="amount">$${data.optionBTotal} CAD</div>
      </div>
    </div>
    <div class="extra-choices">
      <button type="button" data-value="Both">I'd like both quoted</button>
      <button type="button" data-value="Declined">Not proceeding</button>
    </div>
    <label class="remarks-label" for="remarks">Comments or questions (optional)</label>
    <textarea id="remarks" placeholder="Let us know if you have any questions or requests..."></textarea>
    <button class="submit-btn" id="submitBtn" disabled>Select an option above to continue</button>
  `;

  const choiceEls = contentEl.querySelectorAll('.option-choice, .extra-choices button');
  choiceEls.forEach(el => {
    el.addEventListener('click', () => {
      choiceEls.forEach(e => e.classList.remove('selected'));
      el.classList.add('selected');
      selectedDecision = el.getAttribute('data-value');
      const btn = document.getElementById('submitBtn');
      btn.disabled = false;
      btn.textContent = 'Submit My Response';
    });
  });

  document.getElementById('submitBtn').addEventListener('click', submitResponse);
}

async function submitResponse() {
  if (!selectedDecision) return;
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Submitting…';
  const remarks = document.getElementById('remarks').value;

  try {
    const resp = await fetch(`${WORKER_BASE}/api/proposal/submit`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ responseToken: token, decision: selectedDecision, remarks }),
    });
    const data = await resp.json();
    if (data.status !== 'success') {
      throw new Error(data.reason || 'Failed to submit your response.');
    }
    contentEl.innerHTML = `<div class="status-msg">Thank you — your response has been recorded. Our team will be in touch shortly.</div>`;
  } catch (err) {
    btn.disabled = false;
    btn.textContent = 'Submit My Response';
    alert(err.message || 'Something went wrong. Please try again.');
  }
}

loadProposal();
</script>
</body>
</html>
