<style>

<body>

<div class="page-shell"><div id="root">
  <div class="status-msg">Loading your quote&hellip;</div>
</div>

<div class="it-float" id="itFloat">
  <button class="it-tab" onclick="toggleIT()">Technical Support</button>
  <div class="it-panel" id="itPanel">
    <button class="it-close" onclick="toggleIT()">&#x2715;</button>
    <h4>Technical Issues?</h4>
    <p>Having trouble? Email our IT support team and we will respond promptly.</p>
    <a href="mailto:itsupport@essentialcures.com">Email IT Support</a>
  </div>
</div>

<script>
function toggleIT(){ document.getElementById('itPanel').classList.toggle('open'); }

const WORKER_BASE = 'https://cm27-gate-proxy.faisal-khan-e13.workers.dev';
const RESPONSE_BASE = 'https://ec-customer-response-worker.faisal-khan-e13.workers.dev';
const params = new URLSearchParams(window.location.search);
const token = params.get('token');
const quoteId = params.get('id');
let selectedDecision = null;
let quoteData = null;

function fmt(n) {
  const num = parseFloat(n);
  if (isNaN(num)) return '0.00';
  return num.toLocaleString('en-CA', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function fmtQty(n) {
  const num = parseInt(n, 10);
  if (isNaN(num)) return n;
  return num.toLocaleString('en-CA');
}

function showError(msg) {
  document.getElementById('root').innerHTML = `<div class="status-msg error">${msg}</div>`;
}

async function loadQuote() {
  if (!token || !quoteId) { showError('This link is missing a required parameter. Please use the link from your quote email.'); return; }
  try {
    const resp = await fetch(`${WORKER_BASE}/api/quote/gate`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ quoteId, token }),
    });
    const data = await resp.json();
    if (data.status !== 'allow') { showError(data.message || data.reason || 'This quote link is invalid or has expired.'); return; }
    if (data.decisionRecorded) {
      quoteData = data;
      if (data.customerDecision === 'Declined') { showDeclined(); return; }
      initHub(data, data.customerDecision);
      return;
    }
    renderPage(data);
  } catch(e) {
    showError('Something went wrong loading your quote. Please try again or contact us directly.');
  }
}

function buildDeliveryBlock(ds) {
  if (!ds) return '';
  const note = ds.partialShipment
    ? 'Products ship from different suppliers — partial shipments expected. Full order completes within the maximum lead time.'
    : 'All products ship together from a single fulfilment.';
  const rows = (ds.productLines || []).map(pl =>
    `<tr><td>${pl.product}</td><td>${pl.leadDays && pl.leadDays !== '0' ? pl.leadDays + ' days' : 'Pending confirmation'}</td><td>${pl.fulfilmentMode || '—'}</td></tr>`
  ).join('');
  return `
  <tr><td style="padding: 16px 0 0 0">
    <table width="100%" cellpadding="0" cellspacing="0"><tbody><tr>
      <td style="width:4px;background:rgb(0,112,176);font-size:0;line-height:0">&nbsp;</td>
      <td style="width:8px">&nbsp;</td>
      <td style="padding:12px 14px">
        <div class="delivery-block">
          <p class="delivery-heading">Estimated Delivery</p>
          <p class="delivery-range">${ds.leadTimeRange}</p>
          <p class="delivery-note">${note}</p>
          ${rows ? `<table class="delivery-table"><thead><tr><th>Product</th><th>Lead Time</th><th>Fulfilment</th></tr></thead><tbody>${rows}</tbody></table>` : ''}
        </div>
      </td>
    </tr></tbody></table>
  </td></tr>`;
}

function buildPaymentBlock(ds, grandTotal) {
  if (!ds) return '';
  const advance = parseFloat(ds.totalAdvanceAmount || '0');
  if (advance <= 0) return '';
  const total = parseFloat(grandTotal || '0');
  const balance = Math.max(0, total - advance);
  return `
  <tr><td style="padding: 10px 0 0 0">
    <table width="100%" cellpadding="0" cellspacing="0"><tbody><tr>
      <td style="width:4px;background:rgb(74,139,44);font-size:0;line-height:0">&nbsp;</td>
      <td style="width:8px">&nbsp;</td>
      <td style="padding:12px 14px">
        <div class="payment-block">
          <p class="payment-heading">Payment Plan — Progressive Payment Structure</p>
          <div class="payment-row"><span class="payment-lbl">Advance Payment (on order confirmation)</span><span class="payment-val">${fmt(advance)}</span></div>
          <div class="payment-row"><span class="payment-lbl">Balance on delivery</span><span class="payment-val">${fmt(balance)}</span></div>
          <div class="payment-row grand"><span class="payment-lbl">Order Total</span><span class="payment-val">${fmt(total)}</span></div>
        </div>
      </td>
    </tr></tbody></table>
  </td></tr>`;
}

function renderPage(data) {
  quoteData = data;
  const isDualOption = data.siblingQuote != null;
  const hasDiscount = data.discountAmount && parseFloat(data.discountAmount) > 0;
  const hasSavings = data.savingsAmount && parseFloat(data.savingsAmount) > 0;

  const alreadyBlock = data.alreadyResponded
    ? `<div class="already-note">You already responded to this quote on <strong>${data.existingDecisionDate}</strong> with: <strong>${data.existingDecision}</strong>.</div>`
    : '';

  const subTotal = hasDiscount
    ? fmt(parseFloat(data.grandTotal) + parseFloat(data.discountAmount))
    : fmt(data.grandTotal);

  const lineRows = (data.lineItems || []).map((li, i) => {
    if (li.isDivider) return `<tr><td colspan="5" style="background:rgb(247,249,251);font-weight:bold;border-top:2px solid rgb(143,194,60);padding:8px 10px;">${li.description}</td></tr>`;
    const cls = i % 2 === 0 ? 'items-row' : 'items-row-alt';
    return `<tr class="${cls}">

/* ---------------- Shared helpers ---------------- */
function getOptionFigures(decision) {
  const d = quoteData || {};
  if (decision === 'Option B - Specialist' && d.siblingQuote) {
    const ds = d.siblingQuote.deliverySummary || {};
    return { advance: parseFloat(ds.totalAdvanceAmount || '0'), total: parseFloat(d.siblingQuote.grandTotal || '0') };
  }
  const ds = d.deliverySummary || {};
  return { advance: parseFloat(ds.totalAdvanceAmount || '0'), total: parseFloat(d.grandTotal || '0') };
}

function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function fmtDate(iso) {
  if (!iso || iso.length < 10) return '';
  const m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const y = iso.slice(0, 4), mo = parseInt(iso.slice(5, 7), 10), dd = parseInt(iso.slice(8, 10), 10);
  if (!mo || !dd) return '';
  return dd + ' ' + m[mo - 1] + ' ' + y;
}

function todayIso() { return new Date().toISOString().slice(0, 10); }

async function sendRequest(path, body, isForm, timeoutMs) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs || 45000);
  let resp;
  try {
    const opts = { method: 'POST', body: isForm ? body : JSON.stringify(body), signal: ctrl.signal };
    if (!isForm) opts.headers = { 'Content-Type': 'application/json' };
    resp = await fetch(`${RESPONSE_BASE}${path}`, opts);
  } catch (e) {
    clearTimeout(timer);
    if (e.name === 'AbortError') throw new Error('The request took too long to complete. Please try again, or contact customercare@essentialcures.com.');
    throw new Error('Unable to reach Essential Cures. Please check your connection and try again.');
  }
  clearTimeout(timer);
  let data;
  try { data = await resp.json(); } catch {
    throw new Error('The server returned an unexpected response (HTTP ' + resp.status + ').');
  }
  if (data.status !== 'ok') throw new Error(data.message || data.reason || 'The request could not be completed.');
  return data;
}

function postJson(path, payload) { return sendRequest(path, payload, false, 45000); }

function pageShell(inner) {
  return `<table class="main" cellpadding="0" cellspacing="0"><tbody><tr><td style="padding:24px">${inner}</td></tr></tbody></table>`;
}

function showThankYou(message) {
  document.getElementById('root').innerHTML = pageShell(`
    <div class="status-msg">${message}<br><br>You may now close this window.</div>
    <button class="close-btn" onclick="window.close()">Close This Window</button>
    <p style="text-align:center;margin-top:14px;font-size:12px"><a href="https://essentialcures.com" style="color:rgb(0,80,144);font-weight:bold;text-decoration:none">Return to essentialcures.com</a></p>`);
}

function showDeclined() {
  const qn = (quoteData && quoteData.quoteNumber) || 'this quotation';
  showThankYou(`Your response declining quotation ${esc(qn)} has been recorded. Should you wish to revisit this quotation, please contact <a href="mailto:customercare@essentialcures.com" style="color:rgb(0,80,144);font-weight:bold">customercare@essentialcures.com</a>.`);
}

async function submitResponse() {
  if (!selectedDecision) return;
  const btn = document.getElementById('submitBtn');
  const errBox = document.getElementById('decisionError');
  btn.disabled = true;
  btn.textContent = 'Submitting\u2026';
  errBox.textContent = '';
  try {
    await postJson('/api/quote/decision', { quoteId, token, decision: selectedDecision });
    if (selectedDecision === 'Declined') { showDeclined(); return; }
    quoteData.decisionRecorded = true;
    initHub(quoteData, selectedDecision);
  } catch (e) {
    btn.disabled = false;
    btn.textContent = 'Submit My Response';
    errBox.textContent = e.message;
  }
}

function bindHub() {
  document.querySelectorAll('.hb-seg button').forEach(btn => {
    btn.addEventListener('click', () => {
      const panel = btn.dataset.seg, mode = btn.dataset.mode;
      document.querySelectorAll(`.hb-seg button[data-seg="${panel}"]`).forEach(b => b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'));
      const online = document.getElementById(panel + '-online');
      const email = document.getElementById(panel + '-email');
      if (online) online.hidden = mode !== 'online';
      if (email) email.hidden = mode !== 'email';
      if (online && mode === 'online') online.style.display = 'flex';
    });
  });

  const fileInput = document.getElementById('po-file');
  const drop = document.getElementById('po-drop');
  if (fileInput && drop) {
    fileInput.addEventListener('change', () => setPoFile(fileInput.files && fileInput.files[0]));
    ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
    ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
    drop.addEventListener('drop', e => { const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if (f) setPoFile(f); });
  }
  const allBtn = document.getElementById('all-submit');
  if (allBtn) allBtn.addEventListener('click', submitAll);
}

function setPoFile(f) {
  const err = document.getElementById('po-err');
  const name = document.getElementById('po-fname');
  err.textContent = '';
  if (!f) { hubFile = null; name.textContent = ''; return; }
  if (!DOC_TYPES[f.type]) { hubFile = null; name.textContent = ''; err.textContent = 'The document must be a PDF, JPG or PNG file.'; return; }
  if (f.size > DOC_MAX) { hubFile = null; name.textContent = ''; err.textContent = 'The document exceeds the 10 MB limit. Please reduce its size or send it by email.'; return; }
  hubFile = f;
  const kb = f.size / 1024;
  name.textContent = `Selected: ${f.name} (${kb >= 1024 ? (kb / 1024).toFixed(1) + ' MB' : Math.max(1, Math.round(kb)) + ' KB'})`;
}

async function submitAll() {
  const btn = document.getElementById('all-submit');
  const allErr = document.getElementById('all-err');
  const poErr = document.getElementById('po-err');
  const payErr = document.getElementById('pay-err');
  [allErr, poErr, payErr].forEach(el => { if (el) el.textContent = ''; });

  const poBox = document.getElementById('po-online');
  const payBox = document.getElementById('pay-online');
  const poOnline = !!poBox && !poBox.hidden;
  const payOnline = !!payBox && !payBox.hidden;

  const poNum = poOnline ? document.getElementById('po-num').value.trim() : '';
  const poDate = poOnline ? document.getElementById('po-date').value : '';
  const doPo = poOnline && (poNum !== '' || !!hubFile);

  const payRef = payOnline ? document.getElementById('pay-ref').value.trim() : '';
  const doPay = payOnline && payRef !== '';
  let amount = 0, method = '', payDate = '';
  if (payOnline) {
    amount = parseFloat(document.getElementById('pay-amt').value);
    method = document.getElementById('pay-method').value;
    payDate = document.getElementById('pay-date').value;
  }

  if (!doPo && !doPay) {
    allErr.textContent = 'Please complete at least one section online, or choose Send by Email for each item.';
    return;
  }
  if (doPay) {
    if (isNaN(amount) || amount <= 0) { payErr.textContent = 'Please enter the amount paid.'; return; }
    if (!payDate) { payErr.textContent = 'Please enter the payment date.'; return; }
  }

  btn.disabled = true;
  btn.textContent = 'Submitting\u2026';
  const notices = [];
  let anySuccess = false;

  if (doPo) {
    try {
      const fd = new FormData();
      fd.append('quoteId', quoteId);
      fd.append('token', token);
      fd.append('poNumber', poNum);
      fd.append('poDate', poDate);
      if (hubFile) fd.append('poDocument', hubFile, hubFile.name);
      const r = await sendRequest('/api/po/submit', fd, true, 60000);
      hub.poState = 'received';
      hub.poNumber = poNum;
      hub.poDate = poDate;
      hub.poReceived = todayIso();
      if (r.attachmentMessage) notices.push(r.attachmentMessage);
      anySuccess = true;
    } catch (e) {
      notices.push('Your purchase order could not be submitted: ' + e.message);
    }
  }

  if (doPay) {
    try {
      const r = await postJson('/api/payment/submit', {
        quoteId, token,
        paymentMethod: method,
        transactionReference: payRef,
        amountSubmitted: amount.toFixed(2),
        paymentDate: payDate,
      });
      hub.payState = 'pending';
      hub.payRef = r.paymentId || '';
      anySuccess = true;
    } catch (e) {
      notices.push('Your payment details could not be recorded: ' + e.message);
    }
  }

  if (anySuccess) {
    hub.notice = notices.join(' ');
    renderHub();
  } else {
    btn.disabled = false;
    btn.textContent = 'Submit Order Details';
    allErr.textContent = notices.join(' ');
  }
}

loadQuote();
</script>
</div><!-- end page-shell -->
</body>
</html>
